app_name: food-analysis-backend

database:
  url: mysql+pymysql://food:foodpass@mysql:3306/food_analysis?charset=utf8mb4

redis:
  url: redis://redis:6379/0

storage:
  root_dir: storage/uploads
  max_bytes: 10485760
  keep_days: 7

providers:
  # 改成 false 后会调用真实 DeepSeek / 千问 / 高德接口。
  # 如果只是本地跑通接口，可临时改回 true。
  use_mock_models: false
  deepseek_api_key: "sk-cefb2b02c3764267ad713be741d3c49e"
  deepseek_base_url: https://api.deepseek.com
  deepseek_model: deepseek-v4-flash
  qwen_api_key: "sk-c0fb0b5273b24de7b880244e0d8a5765"
  qwen_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  qwen_vision_model: qwen-vl-plus
  amap_key: ""
  request_timeout_seconds: 120

security:
  enabled: true
  # 生产环境请改成你自己的长随机字符串；小程序端只调你的后端，模型 Key 不放前端。
  client_keys:
    - dev-client-key
  header_name: X-Client-Key
  rate_limit_per_minute: 30
  analysis_limit_per_day: 200

logging:
  print_request_response: true
  print_model_request_response: true
  max_body_chars: 4000
